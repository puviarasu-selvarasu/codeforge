{% extends 'studio/base_studio.html' %}
{% load static %}

{% block studio_content %}
<div class="studio-detail" x-data="studioDetail()" x-init="init()">
    <div class="studio-header">
        <div class="header-left">
            <h1>{{ project.name }}</h1>
            <span class="badge">{{ project.framework }}</span>
            <span class="badge">{{ project.status }}</span>
            <span class="senior-badge">👨‍💻 Senior Engineer</span>
        </div>
        <div class="header-right">
            <label for="model-select" style="font-size:0.8rem; color:var(--text-secondary); margin-right:0.3rem;">Model:</label>
            <select id="model-select" x-model="selectedModel" @change="switchModel($event.target.value)" style="background:var(--bg-primary); color:var(--text-primary); border:1px solid var(--border-color); border-radius:4px; padding:0.2rem 0.5rem;">
                <option value="1.5B">Fast (1.5B)</option>
                <option value="7B">Smart (7B)</option>
            </select>
        </div>
    </div>

    <div class="studio-layout">
        <!-- Left: File Tree -->
        <aside class="studio-tree">
            <h3>Files</h3>
            <div id="file-tree">
                <template x-for="item in tree" :key="item.path">
                    <div style="padding-left: 0;">
                        <!-- Folder -->
                        <template x-if="item.is_dir">
                            <div @click="toggleFolder(item)" class="tree-item folder" :style="'padding-left: ' + (item.depth * 16) + 'px'">
                                <span x-text="item.expanded ? '▼' : '▶'"></span>
                                <span x-text="item.name"></span>
                            </div>
                        </template>
                        <!-- File -->
                        <template x-if="!item.is_dir">
                            <div @click="selectFile(item.path)" class="tree-item file" :style="'padding-left: ' + (item.depth * 16) + 'px'">
                                <span x-text="item.name"></span>
                            </div>
                        </template>
                        <!-- Children -->
                        <template x-if="item.is_dir && item.expanded">
                            <template x-for="child in item.children" :key="child.path">
                                <div style="padding-left: 16px;">
                                    <!-- Render child recursively – we'll flatten it -->
                                    <div x-data="{ child: child }">
                                        <template x-if="child.is_dir">
                                            <div @click="toggleFolder(child)" class="tree-item folder">
                                                <span x-text="child.expanded ? '▼' : '▶'"></span>
                                                <span x-text="child.name"></span>
                                            </div>
                                        </template>
                                        <template x-if="!child.is_dir">
                                            <div @click="selectFile(child.path)" class="tree-item file">
                                                <span x-text="child.name"></span>
                                            </div>
                                        </template>
                                        <template x-if="child.is_dir && child.expanded">
                                            <div style="padding-left: 16px;">
                                                <template x-for="grandchild in child.children" :key="grandchild.path">
                                                    <div>
                                                        <template x-if="grandchild.is_dir">
                                                            <div @click="toggleFolder(grandchild)" class="tree-item folder">
                                                                <span x-text="grandchild.expanded ? '▼' : '▶'"></span>
                                                                <span x-text="grandchild.name"></span>
                                                            </div>
                                                        </template>
                                                        <template x-if="!grandchild.is_dir">
                                                            <div @click="selectFile(grandchild.path)" class="tree-item file">
                                                                <span x-text="grandchild.name"></span>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </template>
                    </div>
                </template>
            </div>
        </aside>

        <!-- Center: Contextual Chat -->
        <section class="studio-chat">
            <div class="chat-messages-container" x-ref="messages">
                <template x-for="msg in messages" :key="msg.id">
                    <div class="chat-message" :class="{'user': msg.role === 'user', 'assistant': msg.role === 'assistant'}">
                        <div class="message-bubble" x-html="renderMarkdown(msg.content)"></div>
                    </div>
                </template>
                <div x-show="isLoading" x-data="typingDots()" x-init="init()" x-cloak>
                    <div class="typing-indicator">
                        <span>Thinking</span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                    </div>
                </div>
            </div>
            <div class="chat-input-container">
                <form @submit.prevent="sendMessage()" class="chat-input-row">
                    <input type="text" x-model="currentMessage" placeholder="Ask CodeForge about this project..." class="chat-input">
                    <button type="submit" class="btn btn-primary" :disabled="isLoading || !currentMessage.trim()">
                        <span x-show="!isLoading">Send</span>
                        <span x-show="isLoading" x-cloak>⏳</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- Right: Code Preview -->
        <aside class="studio-preview">
            <h3>Preview</h3>
            <div class="preview-content" x-html="previewContent"></div>
        </aside>
    </div>
</div>
{% endblock %}

{% block extra_js %}
    <script>window.projectId = {{ project.id }};</script>
    <script src="{% static 'js/components/typingDots.js' %}"></script>
    <script src="{% static 'studio/studio.js' %}"></script>
{% endblock %}
