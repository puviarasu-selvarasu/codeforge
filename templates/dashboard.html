{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="chat-layout" x-data="dashboardStore()" x-init="init()">
    <!-- LEFT SIDEBAR: Conversations -->
    <aside class="sidebar-left">
        <h3>Conversations</h3>
        <div>
            <template x-for="conv in conversations" :key="conv.id">
                <div class="conversation-item" 
                     :class="{'active': currentConversation.id === conv.id}"
                     @click="switchConversation(conv.id)">
                    <div class="conv-info">
                        <span x-text="conv.name || 'Untitled'"></span>
                        <span style="font-size:0.65rem; display:block; color:var(--text-secondary);" 
                              x-text="new Date(conv.updated_at).toLocaleDateString()"></span>
                    </div>
                    <button class="conv-delete" @click.stop="deleteConversation(conv.id)" title="Delete">
                        ×
                    </button>
                </div>
            </template>
            <button class="btn btn-primary" @click="newConversation()" style="width:100%; margin-top:0.8rem;">
                + New Chat
            </button>
            <button @click="exportChat()" class="btn btn-secondary btn-sm">📥 Export Chat</button>
        </div>
    </aside>

    <!-- CENTER PANEL: Chat -->
    <section class="center-panel">
        <div class="chat-messages-container" x-ref="messages">
        <template x-for="msg in messages" :key="msg.id">
            <div class="chat-message" :class="{'user': msg.role === 'user', 'assistant': msg.role === 'assistant'}">
                <div class="message-bubble" x-html="renderMarkdown(msg.content)"></div>
                <!-- Copy Button – only for assistant messages with code -->
                <template x-if="msg.role === 'assistant' && msg.content.includes('```')">
                    <button @click="copyCode(msg.content)" class="btn btn-sm btn-secondary copy-btn">
                        📋 Copy Code
                    </button>
                </template>
            </div>
        </template>

            <!-- Typing Indicator -->
            <div x-show="isLoading" x-data="typingDots()" x-init="init()" x-cloak>
                <div class="chat-message assistant">
                    <div>
                        <div class="typing-indicator">
                            <span>Thinking</span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input-container">
            <form @submit.prevent="sendMessage()" class="chat-input-row">
                <input type="text" 
                       x-model="currentMessage" 
                       placeholder="Ask me anything..." 
                       class="chat-input"
                       :disabled="isLoading">
                <button type="submit" 
                        class="btn btn-primary" 
                        :disabled="isLoading || !currentMessage.trim()">
                    <span x-show="!isLoading">Send</span>
                    <span x-show="isLoading" x-cloak>⏳</span>
                </button>
            </form>
        </div>
    </section>
</div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'js/components/typingDots.js' %}"></script>
    <script src="{% static 'js/components/dashboardStore.js' %}"></script>
{% endblock %}
