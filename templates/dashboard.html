{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="chat-layout" x-data="dashboardStore()" x-init="init()">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar-left">
        <h3>Conversations</h3>
        <div>
            <template x-for="conv in conversations" :key="conv.id">
                <div class="conversation-item" 
                     :class="{'active': currentConversation.id === conv.id}"
                     @click="switchConversation(conv.id)">
                    <span x-text="conv.name || 'Untitled'"></span>
                    <span style="font-size:0.65rem; display:block; color:var(--text-secondary);" 
                          x-text="new Date(conv.updated_at).toLocaleDateString()"></span>
                </div>
            </template>
            <button class="btn btn-primary" @click="newConversation()" style="width:100%; margin-top:0.8rem; font-size:0.85rem; padding:0.5rem;">
                + New Chat
            </button>
        </div>
    </aside>

    <!-- CENTER PANEL -->
    <section class="center-panel">
        <div class="chat-messages-container" x-ref="messages">
            <template x-for="msg in messages" :key="msg.id">
                <div class="chat-message" :class="{'user': msg.role === 'user', 'assistant': msg.role === 'assistant'}">
                    <div>
                        <div class="message-header" x-text="msg.role === 'user' ? 'You' : 'CodeForge'"></div>
                        <div class="message-bubble" x-html="renderMarkdown(msg.content)"></div>
                    </div>
                </div>
            </template>

            <div x-show="isLoading" x-data="typingDots()" x-init="init()" x-cloak>
                <div class="chat-message assistant">
                    <div>
                        <div class="message-header">CodeForge</div>
                        <div class="typing-indicator">
                            <span>Thinking</span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <form @submit.prevent="sendMessage()" class="chat-input-row">
                <input type="text" 
                       x-model="currentMessage" 
                       placeholder="Ask me anything..." 
                       class="chat-input"
                       :disabled="isLoading">
                <button type="submit" 
                        class="btn btn-primary" 
                        :disabled="isLoading || !currentMessage.trim()">
                    <span x-show="!isLoading">Send</span>
                    <span x-show="isLoading" x-cloak>⏳</span>
                </button>
            </form>
        </div>
    </section>

    <!-- RIGHT SIDEBAR -->
    <aside class="sidebar-right">
        <h3>Projects</h3>
        <div>
            <template x-for="proj in projects" :key="proj.id">
                <div class="project-card" @click="openProject(proj.id)">
                    <div class="name" x-text="proj.name"></div>
                    <div class="framework" x-text="proj.framework || 'unknown'"></div>
                </div>
            </template>
            <p x-show="projects.length === 0" class="text-muted" style="font-size:0.8rem;">
                No projects yet.
            </p>
        </div>
        <hr class="divider">
        <button class="btn-generate" @click="generateProject()" :disabled="!isProjectReady">
            ✨ Generate Plan
        </button>
        <p x-show="!isProjectReady" class="text-muted" style="font-size:0.7rem; margin-top:0.4rem;">
            After chatting, click to generate a project.
        </p>
    </aside>
</div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'js/components/typingDots.js' %}"></script>
    <script src="{% static 'js/components/dashboardStore.js' %}"></script>
{% endblock %}
