<div x-data="toastComponent()" x-init="init()" 
     class="toast-container"
     x-cloak>
    <template x-for="(toast, index) in toasts" :key="index">
        <div class="toast-item" 
             :class="'toast-' + toast.type"
             x-show="toast.visible"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-y-4"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 translate-y-4">
            <span x-html="toast.message"></span>
            <button @click="removeToast(index)" class="toast-close">✕</button>
        </div>
    </template>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('toastComponent', () => ({
            toasts: [],

            init() {
                window.toast = this;
            },

            show(message, type = 'info', duration = 4000) {
                const toast = { message, type, visible: true };
                this.toasts.push(toast);
                if (duration > 0) {
                    setTimeout(() => {
                        this.removeToast(this.toasts.length - 1);
                    }, duration);
                }
            },

            removeToast(index) {
                if (this.toasts[index]) {
                    this.toasts[index].visible = false;
                    setTimeout(() => {
                        this.toasts.splice(index, 1);
                    }, 300);
                }
            }
        }));
    });
</script>

<style>
.toast-container {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    z-index: 10000;
    max-width: 400px;
}

.toast-item {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 1rem 1.2rem;
    color: var(--text-primary);
    font-size: 0.95rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.05);
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
}

.toast-item.toast-success {
    border-left: 4px solid #00e676;
}
.toast-item.toast-error {
    border-left: 4px solid #ff5252;
}
.toast-item.toast-info {
    border-left: 4px solid var(--accent);
}

.toast-close {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0 0.2rem;
}
.toast-close:hover {
    color: #ff5252;
}
</style>
