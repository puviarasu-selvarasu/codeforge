{% load static %}

<!-- Modal Overlay -->
<div x-data="modalComponent()" x-init="init()" x-show="show" 
     x-cloak
     class="modal-overlay"
     @keydown.escape.window="close()"
     style="display: none;"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0">
    <div class="modal-container" @click.stop>
        <div class="modal-header">
            <span x-text="title" class="modal-title"></span>
            <button @click="close()" class="modal-close">✕</button>
        </div>
        <div class="modal-body" x-html="message"></div>
        <div class="modal-footer" x-show="type === 'confirm'">
            <button @click="confirmAction()" class="btn btn-primary">Confirm</button>
            <button @click="close()" class="btn btn-secondary">Cancel</button>
        </div>
        <div class="modal-footer" x-show="type === 'alert'">
            <button @click="close()" class="btn btn-primary">OK</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('modalComponent', () => ({
            show: false,
            type: 'alert', // 'alert' or 'confirm'
            title: '',
            message: '',
            onConfirm: null,

            init() {
                // Register global modal access
                window.modal = this;
            },

            openAlert(title, message) {
                this.type = 'alert';
                this.title = title;
                this.message = message;
                this.show = true;
            },

            openConfirm(title, message, callback) {
                this.type = 'confirm';
                this.title = title;
                this.message = message;
                this.onConfirm = callback;
                this.show = true;
            },

            close() {
                this.show = false;
                this.onConfirm = null;
            },

            confirmAction() {
                if (this.onConfirm) {
                    this.onConfirm();
                }
                this.close();
            }
        }));
    });
</script>

<style>
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.modal-container {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 2rem;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 0 50px rgba(0, 212, 255, 0.1);
    animation: modalFadeIn 0.25s ease;
}

@keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
}

.modal-title {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text-primary);
}

.modal-close {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 1.5rem;
    cursor: pointer;
    transition: color 0.2s;
    line-height: 1;
}
.modal-close:hover {
    color: #ff5252;
}

.modal-body {
    color: var(--text-secondary);
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 1.5rem;
    word-wrap: break-word;
}

.modal-footer {
    display: flex;
    gap: 0.8rem;
    justify-content: flex-end;
}

.modal-footer .btn {
    padding: 0.5rem 1.5rem;
}
</style>
